name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    # Built on the oldest runner image so the library also loads on older glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: PhysX 5 submodule
        run: git submodule update --init --depth 1 native/third_party/PhysX5
      - name: Configure
        run: cmake -S native -B build -DBUILD_TESTS=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: build/libPhysX5Backend.so

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: PhysX 5 submodule
        run: git submodule update --init --depth 1 native/third_party/PhysX5
      - name: Configure
        run: cmake -S native -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release -j
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: build/Release/PhysX5Backend.dll

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/linux-x86_64/libPhysX5Backend.so
            dist/windows-x86_64/PhysX5Backend.dll
