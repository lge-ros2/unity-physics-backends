name: build

on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    # Built on the oldest runner image so the library also loads on older glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: PhysX 5 submodule
        run: git submodule update --init --depth 1 native/third_party/PhysX5
      - name: Configure
        run: cmake -S native -B build -DBUILD_TESTS=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: build/libPhysX5Backend.so

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: PhysX 5 submodule
        run: git submodule update --init --depth 1 native/third_party/PhysX5
      - name: Configure
        run: cmake -S native -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release -j
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: build/Release/PhysX5Backend.dll

  # A v* tag publishes the libraries twice: as GitHub release assets and inside the commit behind the upm/v* tag.
  # main only carries the sources; the upm/* commit adds the binaries to the package (Plugins~/linux, Plugins~/windows)
  # so that a plain UPM git URL ("...git?path=/packages/com.lge-ros2.physics-backend.physx5#upm/v0.1.0") is complete.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0
      - name: Tag matches package.json
        run: |
          pkg=$(python3 -c "import json;print(json.load(open('packages/com.lge-ros2.physics-backend.physx5/package.json'))['version'])")
          if [ "v$pkg" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version $pkg"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Commit the binaries and tag upm/${{ github.ref_name }}
        run: |
          plugins=packages/com.lge-ros2.physics-backend.physx5/Plugins~
          mkdir -p "$plugins/linux" "$plugins/windows"
          cp dist/linux-x86_64/libPhysX5Backend.so "$plugins/linux/"
          cp dist/windows-x86_64/PhysX5Backend.dll "$plugins/windows/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$plugins/linux/libPhysX5Backend.so" "$plugins/windows/PhysX5Backend.dll"
          git commit -m "release: ${GITHUB_REF_NAME} with prebuilt libraries"
          git tag "upm/${GITHUB_REF_NAME}"
          git push origin "upm/${GITHUB_REF_NAME}"
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/linux-x86_64/libPhysX5Backend.so
            dist/windows-x86_64/PhysX5Backend.dll
